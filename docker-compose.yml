services:
  redis:
    image: redis:7-alpine
    container_name: geodash-redis
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}',
          'ping',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - geodash-network

  mongo:
    image: mongo:7
    container_name: geodash-mongo
    command: ['mongod', '--auth', '--bind_ip_all']
    environment:
      MONGO_INITDB_DATABASE: geodash
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - geodash-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geodash-backend
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST_URL: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/geodash?authSource=admin
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(\"http\").get(\"http://localhost:3000/\", response => process.exit(response.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - geodash-network

  mock-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geodash-mock-simulator
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SERVER_URL: http://backend:3000
    command: npm run simulate
    restart: unless-stopped
    networks:
      - geodash-network

volumes:
  redis-data:
  mongo-data:

networks:
  geodash-network:
    driver: bridge
